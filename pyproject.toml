[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evaluador-lotes-mini"
version = "0.1.0"
description = "Evaluacion agroclimatica, imagenes satelitales y zonificacion productiva para Ceibos"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fiona>=1.10,<2",
  "geopandas>=1.0,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "planetary-computer>=1.0,<2",
  "plotly>=6.0,<7",
  "pyogrio>=0.10,<1",
  "pyproj>=3.7,<4",
  "pystac-client>=0.8,<1",
  "python-dotenv>=1.0,<2",
  "rasterio>=1.4,<2",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "shapely>=2.0,<3",
  "snowflake-connector-python>=3.14,<5",
  "streamlit>=1.42,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "responses>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
evaluador-lotes = "evaluador_lotes_mini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluador_lotes_mini"]

[tool.hatch.build]
include = [
  "src/evaluador_lotes_mini/**/*.py",
  "src/evaluador_lotes_mini/assets/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
